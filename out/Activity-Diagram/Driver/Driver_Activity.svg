@startuml Driver_Activity

skinparam backgroundColor #FFFFFF
skinparam activity {
  BackgroundColor #FFFFFF
  BorderColor #1D9E75
  FontSize 12
  FontName Arial
}

title Activity Diagram - Driver

|Driver|

start

:Open mobile app;

repeat
  :Enter email and password;

  if (Login valid?) then (Yes)
    break
  else (No)
    :Show error message;
  endif

repeat while (Invalid login)

:View home dashboard;

:Choose ONE action;

if (Report Incident) then (Yes)
  :Fill incident report form\n(type · description · location);
  :Attach photo/video (optional);
  :Submit report;
  :Show confirmation;

elseif (Send SOS) then (Yes)
  :Send SOS alert;
  :Show SOS confirmation;

else (Navigate)
  :View traffic map;
  :Start live navigation;

endif

:Logout;

stop
@enduml

