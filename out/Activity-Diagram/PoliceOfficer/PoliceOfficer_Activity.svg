@startuml PoliceOfficer_Activity

skinparam backgroundColor #FFFFFF
skinparam activity {
  BackgroundColor #FFFFFF
  BorderColor #D85A30
  FontSize 12
  FontName Arial
}

title Police Officer Activity

|Police Officer|

start

:Open mobile app;

repeat
  :Enter email and password;

  if (Login valid?) then (Yes)
    break
  else (No)
    :Show error message;
  endif

repeat while (Invalid login)

:View dashboard;

:Receive incident alert;

:View report details;

if (Incident severe?) then (Yes)
  :Dispatch emergency services;
else (No)
  :Issue e-fine;
endif

:Monitor incidents;

:Logout;

stop
@enduml

